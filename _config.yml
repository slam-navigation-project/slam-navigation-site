# Site Settings
title: "SLAM Autonomous Driving Project"
description: "LiDAR-based SLAM & Nav2 Autonomous Navigation Project Portfolio"
url: "https://slam-navigation-project.github.io"
baseurl: "/slam-navigation-site"

# Author Details
author:
  name: "SLAM Navigation Team"
  email: "developer@example.com"
  github: "slam-navigation-project"

# Build Settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
